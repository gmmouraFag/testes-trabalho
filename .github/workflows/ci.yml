name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests (API + Client)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run API unit tests (H2 in-memory)
        working-directory: api
        run: |
          chmod +x ./mvnw
          ./mvnw test --no-transfer-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run client unit tests (Jest)
        working-directory: client
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

  e2e-tests:
    name: E2E & API Tests (Playwright)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:8080

      - name: Start API (background)
        working-directory: api
        run: |
          chmod +x ./mvnw
          ./mvnw spring-boot:run -DskipTests &
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/social_media
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API on port 8080..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/posts?limit=1 > /dev/null 2>&1; then
              echo "API is up!"
              break
            fi
            echo "Attempt $i/40 – retrying in 5s..."
            sleep 5
          done

      - name: Start client (background)
        working-directory: client
        run: npm start &
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:8080
          PORT: 3000

      - name: Wait for client to be ready
        run: |
          echo "Waiting for client on port 3000..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Client is up!"
              break
            fi
            echo "Attempt $i/20 – retrying in 3s..."
            sleep 3
          done

      - name: Install E2E test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run E2E and API tests
        working-directory: tests
        run: npm test -- --project=chromium
        env:
          CI: true
